<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>어촌생활</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=Yeon+Sung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 산사처럼 화면 전체가 3D 월드이고 그 위에 반투명 HUD만 얹음.
   왼쪽 위 = 나(얼굴·이름·골드·버프) / 오른쪽 위 = 채널·소리·설정 / 왼쪽 아래 = 채팅 / 가운데 아래 = 상호작용 버튼 + 아이콘 독 / 오른쪽 아래 = 낚시 현황.
   패널은 PC에서 오른쪽 서랍, 폰에서 아래 시트. HUD는 낮·밤 어떤 장면 위에서도 읽히도록 한 가지 어두운 유리 톤으로 고정. */
:root{
  --bg:#e7efee; --surface:#f7fbfa; --surface2:#dae7e5; --ink:#132f38; --muted:#56717a; --line:#bfd2d0;
  --accent:#e2522c; --accent-ink:#ffffff; --sea:#1d5c70; --ok:#2f8f5b;
  --t0:#71877e; --t1:#2a78bb; --t2:#8448cc; --t3:#d4701a; --t4:#b8921a;
  --shadow:0 10px 30px rgba(19,47,56,.18);
  --glass:rgba(16,22,26,.58); --glass-strong:rgba(16,22,26,.72); --glass-line:rgba(255,255,255,.14);
  --hud-ink:#f6f1e7; --hud-muted:rgba(246,241,231,.66); --hud-accent:#ff7a4d;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sl:max(12px,env(safe-area-inset-left,0px)); --sr:max(12px,env(safe-area-inset-right,0px));
  --st:calc(12px + env(safe-area-inset-top,0px)); --sb:calc(12px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b171c; --surface:#11222a; --surface2:#183039; --ink:#d9e7e8; --muted:#8aa2a8; --line:#23404a;
  --accent:#ff6a42; --accent-ink:#1a0d08; --sea:#5fb3cc; --ok:#55c487;
  --t0:#9cb1a8; --t1:#62a9e8; --t2:#b38af0; --t3:#f39a4c; --t4:#e6c446;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b171c; --surface:#11222a; --surface2:#183039; --ink:#d9e7e8; --muted:#8aa2a8; --line:#23404a;
  --accent:#ff6a42; --accent-ink:#1a0d08; --sea:#5fb3cc; --ok:#55c487;
  --t0:#9cb1a8; --t1:#62a9e8; --t2:#b38af0; --t3:#f39a4c; --t4:#e6c446;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{background:#173845;color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hud-accent);outline-offset:2px}

.app{position:fixed;inset:0;overflow:hidden;background:#173845}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--glass-line);color:var(--hud-ink);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2)}
.hud{position:absolute;z-index:3}
.ico{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 왼쪽 위: 나 */
.me{left:var(--sl);top:var(--st);display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 140px)}
.mecard{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px}
.mecard canvas{width:44px;height:44px;border-radius:50%;display:block;flex-shrink:0}
.mecard .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.mecard .nm{border:0;background:none;padding:0;font-weight:700;font-size:14px;color:var(--hud-ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mecard .gd{font-family:var(--f-mono);font-size:13px;color:#ffd77a;font-variant-numeric:tabular-nums}
.buffs{display:flex;gap:6px;flex-wrap:wrap}
.buff{font-size:11.5px;padding:3px 10px;border-radius:999px;background:rgba(85,196,135,.28);border:1px solid rgba(85,196,135,.5);color:var(--hud-ink);font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* 오른쪽 위: 채널·설정 */
.tr{right:var(--sr);top:var(--st);display:flex;gap:8px;align-items:center}
.chan{padding:8px 14px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.chan b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--hud-accent);margin-right:6px}
.chan .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#55d58a;margin:0 6px 1px 2px}
.icobtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.icobtn[aria-pressed="true"]{background:rgba(255,122,77,.55)}
.pop{position:absolute;right:var(--sr);top:calc(var(--st) + 50px);z-index:6;width:250px;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--glass-strong)}
.pop button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;color:var(--hud-ink);padding:9px 10px;border-radius:10px;font-size:13.5px;text-align:left}
.pop button:hover{background:rgba(255,255,255,.08)}
.pop button span{color:var(--hud-muted);font-size:12px}
.pop button[aria-pressed="true"] span{color:#7ee0a6}
.pop .meta{padding:8px 10px 4px;font-size:11.5px;color:var(--hud-muted);border-top:1px solid var(--glass-line);margin-top:4px}

/* 가운데: 장소·힌트·토스트 */
.place{position:absolute;left:50%;top:calc(var(--st) + 4px);transform:translateX(-50%);font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .6s;z-index:3;white-space:nowrap}
.place.on{opacity:1}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 132px);padding:6px 14px;border-radius:999px;font-size:12.5px;pointer-events:none;z-index:2;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;opacity:.92}
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 44px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(360px,calc(100% - 24px));z-index:5}
.toast{background:var(--glass-strong);color:var(--hud-ink);border:1px solid var(--glass-line);border-radius:14px;padding:9px 14px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:tin .25s ease-out;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast .muted{color:var(--hud-muted)}
.toast.catch{display:flex;gap:10px;align-items:center}
.toast.catch img{width:64px;height:32px;object-fit:contain}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* 가운데 아래: 상호작용·챔질·일어나기 + 독 */
.actbtn{position:absolute;left:50%;bottom:calc(var(--sb) + 84px);transform:translateX(-50%);z-index:4;border:0;border-radius:999px;
  padding:12px 28px;background:var(--hud-accent);color:#fff;font-family:var(--f-display);font-size:19px;box-shadow:0 0 0 4px rgba(255,255,255,.28),0 10px 24px rgba(0,0,0,.3);white-space:nowrap;animation:tin .2s ease-out}
.actbtn kbd{font-family:var(--f-mono);font-size:11px;opacity:.85;margin-left:8px;border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:0 5px}
.actbtn.soft{background:var(--glass-strong);font-size:16px;padding:10px 22px;box-shadow:0 0 0 1px var(--glass-line)}
.hook{position:absolute;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);z-index:4;
  width:108px;height:108px;border-radius:50%;border:0;background:var(--hud-accent);color:#fff;font-family:var(--f-display);font-size:26px;
  box-shadow:0 0 0 6px rgba(255,255,255,.35),0 12px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  animation:pulse .5s ease-in-out infinite alternate}
.hook small{font-family:var(--f-mono);font-size:11px;opacity:.85}
@keyframes pulse{to{transform:translateX(-50%) scale(1.07)}}
.dock{left:50%;bottom:var(--sb);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:22px}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--hud-ink);padding:7px 12px 6px;border-radius:16px;font-size:11.5px;min-width:56px}
.dock button:hover{background:rgba(255,255,255,.1)}
.dock button .ico{width:22px;height:22px}
.dock .cnt{display:none}
.badge{position:absolute;top:0;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--hud-accent);color:#fff;font-size:11px;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0 5px}
.dock .chatonly{display:none}

/* 오른쪽 아래: 낚시 현황 (산사의 염주 횟수처럼 늘 보이는 숫자) */
.stat{right:var(--sr);bottom:var(--sb);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:150px}
.stat .big{display:flex;align-items:baseline;gap:6px}
.stat .big b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--hud-ink);font-variant-numeric:tabular-nums}
.stat .big span{font-size:12px;color:var(--hud-muted)}
.stat .ln{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--hud-muted)}
.stat .ln b{color:var(--hud-ink);font-weight:500;font-family:var(--f-mono);font-size:12px}
.stat button{border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:var(--hud-ink);border-radius:10px;padding:5px 10px;font-size:12.5px;text-align:left}

/* 왼쪽 아래: 채팅 */
.chat{left:var(--sl);bottom:var(--sb);width:min(360px,calc(50% - 90px));border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px 14px;font-size:12px;color:var(--hud-muted)}
.chat-head button{border:0;background:none;color:var(--hud-muted);font-size:12px;padding:2px 6px;border-radius:8px}
#chatList{list-style:none;margin:0;padding:2px 14px 6px;overflow-y:auto;max-height:190px;display:flex;flex-direction:column;gap:5px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px);mask-image:linear-gradient(180deg,transparent 0,#000 18px)}
.chat.min #chatList{display:none}
#chatList li{line-height:1.45;word-break:break-word;font-size:13px;color:var(--hud-ink)}
#chatList .who{font-weight:700;margin-right:6px;filter:brightness(1.35)}
#chatList .tm{color:var(--hud-muted);font-family:var(--f-mono);font-size:10px;margin-left:6px}
#chatList li.sys{font-size:12px;color:#ffe2a8}
#chatList li.brag{display:flex;gap:8px;align-items:center;border-radius:10px;padding:5px 8px;background:rgba(255,255,255,.08)}
#chatList li.brag img{width:56px;height:28px;object-fit:contain;flex-shrink:0}
#chatList li.brag .bt{font-size:12px;min-width:0}
#chatList li.empty{color:var(--hud-muted);font-size:12px}
#chatForm{display:flex;gap:6px;padding:6px}
#chatInput{flex:1;min-width:0;border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--hud-ink);border-radius:12px;padding:8px 12px}
#chatInput::placeholder{color:var(--hud-muted)}
#chatForm button{border:0;background:var(--hud-accent);color:#fff;border-radius:12px;padding:8px 14px}

.mungexit{position:absolute;left:var(--sl);bottom:var(--sb);z-index:3;border:0;border-radius:999px;padding:7px 14px;font-size:12.5px;opacity:.55}
.mungexit:hover{opacity:1}
.boatbar{position:absolute;left:50%;top:var(--st);transform:translateX(-50%);z-index:4;padding:7px 16px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.coop{position:absolute;left:50%;top:calc(var(--st) + 52px);transform:translateX(-50%);z-index:6;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;width:min(360px,calc(100% - 24px));background:var(--glass-strong)}
.coop h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.coop .sub{font-size:12.5px;color:var(--hud-muted);line-height:1.5}
.coop .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.coop button{border:0;border-radius:12px;padding:9px 16px;background:rgba(255,255,255,.12);color:var(--hud-ink);font-size:14px}
.coop button.pri{background:var(--hud-accent);color:#fff}
.coop button.quiet{background:none;color:var(--hud-muted);font-size:12.5px;padding:2px 8px}
.coop button:disabled{opacity:.6}
.emopop{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:calc(var(--sb) + 78px);width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
.emopop button{font-size:14px;padding:8px 12px}
.reel-coop{font-size:12px;color:#ffe2a8}
.stat #questBtn b{font-weight:500;color:#ffd77a}
.gear-slot{display:flex;gap:8px;flex-wrap:wrap}
body.mung .hud, body.mung .hint, body.mung .actbtn, body.mung .pop, body.mung .boatbar{display:none!important}

/* sheets: PC는 오른쪽 서랍 (월드가 계속 보이게), 폰은 아래 시트 */
.overlay{position:fixed;inset:0;background:rgba(6,18,22,.22);display:flex;align-items:stretch;justify-content:flex-end;z-index:20;padding:var(--st) var(--sr) var(--sb) 12px}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.35);width:min(480px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:slidein .22s ease-out}
.sheet.wide{width:min(800px,100%)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:12.5px}
.close{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.sbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;letter-spacing:.02em}
.tier.t0{background:var(--t0)}.tier.t1{background:var(--t1)}.tier.t2{background:var(--t2)}.tier.t3{background:var(--t3)}.tier.t4{background:var(--t4)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sec{font-family:var(--f-display);font-size:16px;margin:4px 0 -4px}
.listrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);flex-wrap:wrap}
.listrow img{width:64px;height:32px;object-fit:contain;flex-shrink:0}
.listrow .grow{flex:1;min-width:140px}
.listrow input[type=number]{width:96px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}

.bait{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;align-items:center}
.bait.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bait h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bait .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pbar{grid-column:1/-1;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.pbar i{display:block;height:100%}
.plegend{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.plegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;background:var(--bg);min-width:0}
.card .pic{height:62px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--sea) 18%,transparent),color-mix(in srgb,var(--sea) 34%,transparent))}
.card .pic img{max-width:100%;max-height:56px}
.card .pic.unknown img{filter:brightness(0) opacity(.35)}
.card .nm{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.card .desc{font-size:12px;color:var(--muted);line-height:1.4}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty-note{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}

.studio{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}
.canvasbox{position:relative;width:100%;max-width:640px;aspect-ratio:2/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.08) 22px 23px),linear-gradient(180deg,#5fa3b8,#1f5f73)}
.canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:640px}
.palette button{aspect-ratio:1;border-radius:6px;border:2px solid transparent;padding:0;min-width:0}
.palette button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.toolrow{display:flex;gap:6px;flex-wrap:wrap}
.toolrow .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;resize:vertical}
.rgrades{display:flex;flex-direction:column;gap:6px}

  const ref = inboxRef(id);
  try {
    const r = await ref.acquire({ holder: S.uid, ttlMs: 5000 });
    if (!r.acquired) { toast("처리 중이에요. 잠시 후 다시 눌러 주세요"); return; }
    const snap = await ref.get();
    if (!snap.exists) { toast("상대가 제안을 취소했어요"); return; }
    const item = normItem(v.item); const price = clamp(Math.round(Number(v.price) || 0), 0, 1000000);
    if (accept) {

      if (P.bag.length >= BAG_MAX) { toast("가방이 가득 찼어요. 한 칸 비우고 받아 주세요"); return; }
    }
    await ref.delete();
    if (accept && item) { P.gold -= price; item.id = uid4(); P.bag.unshift(item); markDirty(); await flushSave(); }
    await sendInbox(v.from, { type: "trade_result", tid: v.tid, ok: !!accept });

  } catch { toast("처리하지 못했어요. 다시 시도해 주세요"); }
  refreshSheet();
}
async function cancelTrade(tid) {

    if (S.myStall >= 0 && (!arr[S.myStall] || arr[S.myStall].owner !== uid)) { S.myStall = -1; clearInterval(hbTimer); ME.st = "idle"; updateLeaveBtn(); toast("노점이 닫혔어요"); }
    if (S.sheet === "stall" || S.sheet === "mystall") refreshSheet();
  }, (e) => console.warn("stalls", e));
  db.collection("inbox/" + uid + "/items").onSnapshot(onInbox, (e) => console.warn("inbox", e));
  db.collection("trades").orderBy("ts", "desc").limit(30).onSnapshot((snap) => {
    S.trades = snap.docs.map(d => normTrade(d.id, d.data() || {})).filter(Boolean);
    if (S.sheet === "bank" && S.bankTab === "trades") refreshSheet();
  }, (e) => console.warn("trades", e));
  window.addEventListener("pagehide", () => { flushSave(); });
  updateHint();
}
boot();
})();
</script>
