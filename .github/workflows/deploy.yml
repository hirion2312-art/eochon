# main 브랜치에 게임이 올라오면 웹사이트(Firebase Hosting)에 자동으로 배포해요.
# 필요한 것: 저장소 Secrets 의 FIREBASE_SERVICE_ACCOUNT_EOCHON_LIFE (서비스 계정 키)
#   (web 폴더에서 `firebase init hosting:github` 를 한 번 하면 이 이름으로 자동 등록돼요)
#   + web/public/firebase-config.js 에 내 프로젝트 설정값
# 비밀값은 이 키 하나만 이름으로 읽어요. 전체를 읽으면(toJSON(secrets)) GitHub가 악성 워크플로로 보고 멈춰요(v1.21~v1.23 때 겪음)
name: 웹사이트 자동 배포

on:
  push:
    branches: [main]
    paths: ["index.html", "a/**", "fish/**", "web/**", "tools/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 웹판 만들기 (게임 + Firebase 연결)
        run: python3 tools/build_web.py

      - name: 배포 준비 확인
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EOCHON_LIFE }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          raw = os.environ.get("SA_JSON", "")
          if not raw.strip():
              print("::notice title=배포 건너뜀::저장소 Secrets 에 FIREBASE_SERVICE_ACCOUNT_EOCHON_LIFE 키가 없어요. README의 '자동 배포 켜기'를 따라 주세요.")
              out.write("ready=false\n"); raise SystemExit(0)
          cfg = pathlib.Path("web/public/firebase-config.js").read_text(encoding="utf8")
          if "여기에-apiKey" in cfg:
              print("::error title=설정 필요::web/public/firebase-config.js 가 아직 견본 그대로예요. 내 Firebase 설정값으로 바꿔서 올려 주세요.")
              raise SystemExit(1)
          sa = json.loads(raw)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sa.json"
          path.write_text(json.dumps(sa))
          out.write("ready=true\n")
          out.write(f"project={sa['project_id']}\n")
          out.write(f"cred={path}\n")
          print("배포할 프로젝트:", sa["project_id"])
          PY

      - uses: actions/setup-node@v4
        if: steps.sa.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: 사이트 배포 (Hosting)
        if: steps.sa.outputs.ready == 'true'
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.cred }}
          MSG: ${{ github.event.head_commit.message }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ steps.sa.outputs.project }}" --non-interactive --message "$(printf '%s' "${MSG:-manual}" | head -n1 | cut -c1-200)"

      - name: Firestore 보안 규칙 배포 (권한이 있으면)
        if: steps.sa.outputs.ready == 'true'
        continue-on-error: true
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.cred }}
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project "${{ steps.sa.outputs.project }}" --non-interactive

      - name: Realtime Database 규칙 배포 (권한이 있으면)
        if: steps.sa.outputs.ready == 'true'
        continue-on-error: true
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.cred }}
        run: npx --yes firebase-tools@13 deploy --only database --project "${{ steps.sa.outputs.project }}" --non-interactive

      - name: 정리
        if: always()
        run: rm -f "${RUNNER_TEMP}/sa.json"
